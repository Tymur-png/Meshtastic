; ============================================================================
; standalone_mesh — autonomous phone-free Meshtastic messenger
; ESP32-S3 + DX-LR30 (SX1262) + ST7789V parallel TFT + 6 buttons + buzzer + TP4056
; Build: pio run -e standalone-mesh
; Flash: pio run -e standalone-mesh -t upload
; ============================================================================
[env:standalone-mesh]
custom_meshtastic_hw_model = 255 ; PRIVATE_HW
custom_meshtastic_hw_model_slug = STANDALONE_MESH
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = Standalone Mesh (DIY)
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = extra
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600

build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/standalone_mesh>

build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3/standalone_mesh
  -D STANDALONE_MESH
  -D PRIVATE_HW
  -D BOARD_HAS_PSRAM
  -D OLED_RU
  -D HAS_SCREEN=1
  -D STANDALONE_UI=1
  ; No phone required: keep Bluetooth compiled out to save RAM/flash
  -D MESHTASTIC_EXCLUDE_BLUETOOTH=1
  -D MESHTASTIC_EXCLUDE_WIFI=1

lib_deps =
  ${esp32s3_base.lib_deps}
  lovyan03/LovyanGFX@1.2.27
